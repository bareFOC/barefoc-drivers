[package]
name = "barefoc-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable no_std, zero-allocation application-side BareBoot handsfree entry helper: bus trigger decoders and cross-reset SRAM mailbox cookie."
keywords = ["bareboot", "bootloader", "no_std", "embedded", "handsfree"]

[dependencies]

# SAFETY: this crate implements the BareBoot cross-reset SRAM mailbox contract,
# which requires volatile reads of the bootloader vector table and a volatile
# 64-bit write to the mailbox address derived from the bootloader's initial SP
# (docs/handsfree-app-updates.md sections 2, 3.6 and 4.1). Those operations are
# confined to `BootTarget::mailbox_addr`, `BootTarget::is_present`,
# `write_cookie` and `clear_cookie`, each carrying its own SAFETY rationale.
# We therefore declare our own lint table instead of inheriting the workspace
# `unsafe_code = "forbid"` (an in-crate `allow` cannot override a `forbid`
# injected on the rustc command line). No other crate's lint policy changes.
[lints.rust]
unsafe_code = "allow"
