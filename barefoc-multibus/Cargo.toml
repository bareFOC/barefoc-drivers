[package]
name = "barefoc-multibus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable no_std descriptor-driven register-map (control table) server core and controller-side client for address-based buses (I2C/SPI)."

[dependencies]
embedded-hal = { workspace = true }
barefoc = { path = "../../barefoc", default-features = false, optional = true }
barefoc-drivers = { path = "../barefoc-drivers", default-features = false, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
embedded-hal = { workspace = true }
embedded-hal-mock = "0.10"
barefoc-drivers = { path = "../barefoc-drivers", default-features = false }

[features]
default = ["std"]
# Host builds/tests. The library itself never links std.
std = []
defmt = ["dep:defmt"]
# SimpleFOC register bridge: pulls barefoc-drivers for RegisterId/RegisterValue/RegisterBridge.
simplefoc-profile = ["dep:barefoc-drivers", "dep:barefoc", "barefoc-drivers?/std"]
# Kinematics register bridge: enables barefoc-drivers/kinematics feature (Actuator1Dof impl).
kinematics = ["simplefoc-profile", "barefoc-drivers/kinematics"]

[lints]
workspace = true
