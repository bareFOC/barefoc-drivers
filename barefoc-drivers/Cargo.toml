[package]
name = "barefoc-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure-Rust, no_std port of the Arduino SimpleFOC-drivers library (extended encoders, gate drivers, comms, voltage sense, utilities) for embedded-hal v1.0 targets."

[dependencies]
barefoc = { path = "../../bareFOC", default-features = false }
libm = { workspace = true }
embedded-hal = { workspace = true }
embedded-io = { workspace = true }
nb = { workspace = true }
barefoc-commander = { path = "../../barefoc-comms/barefoc-commander", default-features = false, optional = true }
drv83xx-rs = { path = "../drv83xx-rs", default-features = false, optional = true }
mt6xxx-rs = { path = "../mt6xxx-rs", default-features = false, optional = true, features = ["barefoc"] }
tmag-rs = { path = "../tmag-rs", default-features = false, optional = true }
defmt = { workspace = true, optional = true }
rtic = { workspace = true, optional = true }

[dev-dependencies]
embedded-hal-mock = "0.10"

[features]
default = ["std", "encoders", "temperature"]
defmt = ["dep:defmt", "barefoc/defmt", "mt6xxx-rs?/defmt"]
rtic = ["dep:rtic", "barefoc/rtic"]
std = ["barefoc/std", "mt6xxx-rs?/std", "tmag-rs?/std"]
commander = ["dep:barefoc-commander"]
drv83xx = ["dep:drv83xx-rs"]
encoders = ["dep:mt6xxx-rs"]
kinematics = ["barefoc/kinematics"]
mt6xxx = ["dep:mt6xxx-rs"]
tmag = ["dep:tmag-rs"]
# ADC-backed NTC thermistor temperature sensor (NtcThermistor).
temperature = []
# Per-encoder / per-driver feature flags are added as each module is ported.
# See `PORTING_STATUS.md` Extended Drivers table.

[lints]
workspace = true
