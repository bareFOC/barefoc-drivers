[package]
name = "tmag-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-performance #![no_std] TMAG5273 3D Hall-effect sensor driver with Embassy async support, 1-byte streaming, and BareFOC 1D/2D adapters."

[dependencies]
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true, optional = true }
libm = { workspace = true }
defmt = { workspace = true, optional = true }
barefoc = { path = "../../bareFOC", default-features = false, optional = true }

[dev-dependencies]
embedded-hal-mock = "0.10"

[features]
default = ["std"]
std = ["barefoc?/std"]
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt", "barefoc?/defmt"]
barefoc = ["dep:barefoc", "barefoc/kinematics"]

[lints]
workspace = true
