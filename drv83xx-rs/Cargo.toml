[package]
name = "drv83xx-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure-Rust, no_std driver for TI DRV83xx 3-phase smart gate drivers (DRV8316, etc.) with Embassy async support and BareFOC integration."

[dependencies]
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true, optional = true }
libm = { workspace = true }
defmt = { workspace = true, optional = true }
barefoc = { path = "../../bareFOC", optional = true }

[dev-dependencies]
embedded-hal-mock = "0.10"

[features]
default = ["std", "barefoc"]
std = []
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt"]
barefoc = ["dep:barefoc"]

[lints]
workspace = true
